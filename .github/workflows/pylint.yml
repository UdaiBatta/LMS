name: Pylint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint==4.0.6
      - name: Analyse Python code
        run: |
          pylint --disable=missing-function-docstring --disable=missing-module-docstring --disable=missing-class-docstring --disable=too-few-public-methods $(git ls-files '*.py' | grep -v '/migrations/')
