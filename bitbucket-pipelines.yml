image: python:3.10

definitions:
  caches:
    pip: ~/.cache/pip

  steps:
    - step: &test
        name: Run Tests
        caches:
          - pip
        script:
          - export SECRET_KEY=ci-only-secret-key-with-more-than-fifty-random-looking-characters
          - export DEBUG=True
          - export EMAIL_BACKEND=django.core.mail.backends.locmem.EmailBackend
          - export EMAIL_HOST_USER=
          - export EMAIL_HOST_PASSWORD=
          - export EMAIL_FROM_ADDRESS=ci@example.com
          - pip install -r requirements.txt
          - python manage.py check
          - python manage.py makemigrations --check --dry-run
          - python manage.py test

    - step: &build-docker
        name: Build Docker Image
        services:
          - docker
        script:
          - docker build -t skylearn:$BITBUCKET_COMMIT .
          - docker tag skylearn:$BITBUCKET_COMMIT skylearn:latest

    - step: &deploy-staging
        name: Deploy to Staging
        deployment: staging
        script:
          - echo "Deploying to staging environment"
          - docker build -t skylearn:staging .
          # Add your staging deployment commands here
          # Example: docker push to registry, deploy to server, etc.

    - step: &deploy-production
        name: Deploy to Production
        deployment: production
        script:
          - echo "Deploying to production environment"
          - docker build -t skylearn:production .
          # Add your production deployment commands here
          # Example: docker push to registry, deploy to server, etc.

pipelines:
  default:
    - step: *test
    - step: *build-docker

  branches:
    develop:
      - step: *test
      - step: *build-docker
      - step: *deploy-staging

    main:
      - step: *test
      - step: *build-docker
      - step: *deploy-production

  pull-requests:
    '**':
      - step: *test

  custom:
    test-only:
      - step: *test
    build-only:
      - step: *build-docker

